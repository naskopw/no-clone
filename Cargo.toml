[package]
name = "no-clone"
version = "0.1.0"
edition = "2024"
description = "A local secret broker for AI-assisted command-line work"
license = "MIT"

[dependencies]
anyhow = "1.0"
base64 = "0.22"
clap = { version = "4.5", features = ["derive"] }
directories = "6.0"
hmac = "0.12"
interprocess = "2.4.2"
libc = "0.2"
rand = "0.8"
rpassword = "7.4"
rusqlite = { version = "0.39.0", features = ["bundled-sqlcipher-vendored-openssl"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_yaml = "0.9"
sha2 = "0.10"
tempfile = "3.23"
zeroize = { version = "1.8", features = ["derive"] }
